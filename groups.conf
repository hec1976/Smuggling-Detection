# /etc/rspamd/local.d/groups.conf
# Zweck: Symbol-Weights zentral ueberschreiben (ersetzt metrics.conf)
# Hinweis: Top-Level "symbols { }" ist am kompatibelsten und greift sicher.

symbols {
   # Hauptsymbol - weight 0.0 lässt dynamischen Score durch
  "HTML_SMUGGLING_PAYLOAD" {
    weight = 1.0;
  }
  
  # Marker (optional - werden automatisch gesetzt)
  "HTML_SMUGGLING_MARKER_SERVICEWORKER" { weight = 0.0; }
  "HTML_SMUGGLING_MARKER_WEBCRYPTO"     { weight = 0.0; }
  "HTML_SMUGGLING_MARKER_QR_CANVAS"     { weight = 0.0; }
  "HTML_SMUGGLING_MARKER_SPLIT_PAYLOAD" { weight = 0.0; }
  
  # Kritische Marker
  "HTML_SMUGGLING_CRITICAL_PE"           { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_WASM"         { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_APPINSTALLER" { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_VHDX"         { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_ISO"          { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_LNK"          { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_OLE"          { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_ZIP"          { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_SCRIPT"       { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_MSIX"         { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_APPX"         { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_CAB"          { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_7ZIP"         { weight = 0.0; }
  "HTML_SMUGGLING_CRITICAL_RAR"          { weight = 0.0; }
   
}

